version: '3.8'

services:
  # Hammurabi CLI service
  hammurabi-cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hammurabi-cli
    environment:
      - VENICE_API_KEY=${VENICE_API_KEY}
      - VENICE_MODEL=qwen-3-7-max
      - HAMMURABI_PRIVATE_KEY=${HAMMURABI_PRIVATE_KEY}
      - ONESHOT_API_KEY=${ONESHOT_API_KEY}
      - ONESHOT_WALLET_ID=${ONESHOT_WALLET_ID}
      - SOVEREIGN_API_URL=${SOVEREIGN_API_URL:-https://api.sovereign.stack}
      - EDUBA_DB_PATH=/app/data/eduba.db
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=info
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
      - ./cache:/app/cache
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    networks:
      - hammurabi-network
    healthcheck:
      test: ["CMD", "hammurabi", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: hammurabi-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-hammurabi123}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - hammurabi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Prometheus metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: hammurabi-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    networks:
      - hammurabi-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090"]
      interval: 15s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Grafana dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: hammurabi-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - hammurabi-network
    restart: unless-stopped

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  hammurabi-network:
    driver: bridge

# Usage:
# 1. Copy .env.example to .env and fill in credentials
# 2. Create prometheus.yml and grafana/provisioning directories
# 3. Start all services: docker-compose up -d
# 4. Hammurabi CLI available at localhost:3000
# 5. Prometheus at localhost:9090
# 6. Grafana at localhost:3001